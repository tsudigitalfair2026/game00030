<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>いぬジャンプ 超難関</title>
<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:sans-serif;
background:#111;
color:#fff;
touch-action:none;
}

.screen{
display:none;
height:100vh;
padding:16px;
text-align:center;
}

.active{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

h1{
margin:10px 0;
}

button{
font-size:20px;
padding:16px 28px;
border:none;
border-radius:12px;
background:#ff9800;
color:#fff;
min-width:180px;
}

#gameScreen{
display:none;
padding:0;
}

#hud{
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
background:#222;
font-weight:bold;
}

#gameArea{
position:relative;
width:100%;
height:calc(100vh - 60px);
overflow:hidden;
background:linear-gradient(#5ec8ff,#b8ecff);
}

#ground{
position:absolute;
bottom:0;
left:0;
width:100%;
height:90px;
background:#4caf50;
}

#dog{
position:absolute;
left:50px;
bottom:90px;
font-size:52px;
user-select:none;
z-index:10;
}

.obstacle{
position:absolute;
bottom:90px;
font-size:42px;
}

.star{
position:absolute;
font-size:38px;
bottom:170px;
}

#jumpBtn{
position:absolute;
right:12px;
bottom:110px;
width:120px;
height:120px;
border-radius:50%;
font-size:24px;
font-weight:bold;
opacity:.9;
z-index:20;
}

.desc{
max-width:500px;
line-height:1.7;
}

.rank{
font-size:40px;
color:#ffd54f;
margin:10px 0;
}

.invincible{
filter:
drop-shadow(0 0 8px gold)
drop-shadow(0 0 15px gold);
animation:blink .2s infinite;
}

@keyframes blink{
50%{
transform:scale(1.08);
}
}

#status{
position:absolute;
left:50%;
transform:translateX(-50%);
top:8px;
font-weight:bold;
color:#ffeb3b;
z-index:30;
}
</style>
</head>
<body>

<div id="startScreen" class="screen active">
<h1>🐶 いぬジャンプ 超難関</h1>

<div class="desc">
60秒生き残ろう！<br>
ジャンプで障害物を回避！<br>
たまに現れる⭐無敵スターを取ると<br>
5秒間ぶつかっても平気！<br>
避けるたびに得点アップ！
</div>

<br>
<button id="startBtn">スタート</button>
</div>

<div id="gameScreen">

<div id="hud">
<div>スコア: <span id="score">0</span></div>
<div>残り: <span id="time">60</span>秒</div>
</div>

<div id="gameArea">
<div id="status"></div>
<div id="dog">🐶</div>
<div id="ground"></div>
<button id="jumpBtn">JUMP</button>
</div>

</div>

<div id="resultScreen" class="screen">
<h1>結果発表</h1>
<div id="finalScore"></div>
<div id="rank" class="rank"></div>
<button id="retryBtn">もう一度遊ぶ</button>
</div>

<script>
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");

const dog=document.getElementById("dog");
const gameArea=document.getElementById("gameArea");

const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const finalScore=document.getElementById("finalScore");
const rankEl=document.getElementById("rank");
const statusEl=document.getElementById("status");

let score=0;
let timeLeft=60;
let playing=false;

let dogY=0;
let velocity=0;
let jumping=false;

const gravity=0.95;
const jumpPower=18;

let obstacles=[];
let stars=[];

let gameLoopId;
let timerId;
let spawnId;
let starId;

let invincible=false;
let invincibleTimer=null;

function startGame(){

startScreen.classList.remove("active");
resultScreen.classList.remove("active");
gameScreen.style.display="block";

score=0;
timeLeft=60;

scoreEl.textContent=score;
timeEl.textContent=timeLeft;

dogY=0;
velocity=0;
jumping=false;

invincible=false;
dog.classList.remove("invincible");
statusEl.textContent="";

dog.style.bottom="90px";

document.querySelectorAll(".obstacle,.star").forEach(e=>e.remove());

obstacles=[];
stars=[];

playing=true;

timerId=setInterval(()=>{
timeLeft--;
timeEl.textContent=timeLeft;

if(timeLeft<=0){
endGame(true);
}
},1000);

spawnObstacle();
spawnId=setInterval(spawnObstacle,650);

starId=setInterval(spawnStar,5000);

gameLoop();
}

function spawnObstacle(){

if(!playing) return;

const obs=document.createElement("div");
obs.className="obstacle";

const types=["🪨","🌵","📦","🔥"];

obs.textContent=types[Math.floor(Math.random()*types.length)];

obs.x=gameArea.clientWidth+30;
obs.speed=10+Math.random()*8+(60-timeLeft)*0.12;

obs.style.left=obs.x+"px";

gameArea.appendChild(obs);
obstacles.push(obs);
}

function spawnStar(){

if(!playing) return;

if(Math.random()<0.5) return;

const star=document.createElement("div");

star.className="star";
star.textContent="⭐";

star.x=gameArea.clientWidth+30;
star.y=140+Math.random()*120;
star.speed=8;

star.style.left=star.x+"px";
star.style.bottom=star.y+"px";

gameArea.appendChild(star);
stars.push(star);
}

function jump(){

if(!playing) return;

if(jumping) return;

jumping=true;
velocity=jumpPower;
}

function activateInvincible(){

invincible=true;

dog.classList.add("invincible");

statusEl.textContent="⭐ 無敵中！";

clearTimeout(invincibleTimer);

invincibleTimer=setTimeout(()=>{
invincible=false;
dog.classList.remove("invincible");
statusEl.textContent="";
},5000);
}

function gameLoop(){

if(!playing) return;

velocity-=gravity;
dogY+=velocity;

if(dogY<=0){
dogY=0;
velocity=0;
jumping=false;
}

dog.style.bottom=(90+dogY)+"px";

const dogRect={
left:50,
right:90,
bottom:90+dogY,
top:(90+dogY)+52
};

for(let i=obstacles.length-1;i>=0;i--){

const o=obstacles[i];

o.x-=o.speed;
o.style.left=o.x+"px";

const obsRect={
left:o.x,
right:o.x+40,
bottom:90,
top:132
};

if(
dogRect.right>obsRect.left &&
dogRect.left<obsRect.right &&
dogRect.bottom<obsRect.top &&
dogRect.top>obsRect.bottom
){

if(!invincible){
endGame(false);
return;
}else{
score+=20;
scoreEl.textContent=score;
o.remove();
obstacles.splice(i,1);
continue;
}
}

if(o.x<-60){
score+=10;
scoreEl.textContent=score;
o.remove();
obstacles.splice(i,1);
}
}

for(let i=stars.length-1;i>=0;i--){

const s=stars[i];

s.x-=s.speed;
s.style.left=s.x+"px";

const starRect={
left:s.x,
right:s.x+38,
bottom:s.y,
top:s.y+38
};

if(
dogRect.right>starRect.left &&
dogRect.left<starRect.right &&
dogRect.bottom<starRect.top &&
dogRect.top>starRect.bottom
){

score+=50;
scoreEl.textContent=score;

activateInvincible();

s.remove();
stars.splice(i,1);
continue;
}

if(s.x<-60){
s.remove();
stars.splice(i,1);
}
}

gameLoopId=requestAnimationFrame(gameLoop);
}

function endGame(clear){

playing=false;

clearInterval(timerId);
clearInterval(spawnId);
clearInterval(starId);

cancelAnimationFrame(gameLoopId);

clearTimeout(invincibleTimer);

gameScreen.style.display="none";
resultScreen.classList.add("active");

finalScore.textContent=
(clear?"ゲームクリア！ ":"ゲームオーバー！ ")
+"スコア: "+score;

let rank="C";

if(score>=200) rank="B";
if(score>=400) rank="A";
if(score>=650) rank="S";
if(score>=900) rank="SS";
if(score>=1300) rank="SSS";

rankEl.textContent="ランク "+rank;
}

document.getElementById("startBtn")
.addEventListener("click",startGame);

document.getElementById("retryBtn")
.addEventListener("click",startGame);

const jumpBtn=document.getElementById("jumpBtn");

["pointerdown","mousedown","touchstart"].forEach(evt=>{
jumpBtn.addEventListener(evt,e=>{
e.preventDefault();
jump();
});
});

window.addEventListener("keydown",e=>{
if(e.code==="Space"||e.code==="ArrowUp"){
jump();
}
});

document.addEventListener("gesturestart",e=>{
e.preventDefault();
});
</script>

</body>
</html>
